# Restore console log output during failures.
#
# omarchy-defaults.conf sets "quiet splash loglevel=0", which silences the
# console almost entirely. That file belongs to the omarchy-settings package,
# so it is not edited here; this drop-in sorts after it and the later value of
# loglevel wins.
#
# Note this does not change what is RECORDED. journald keeps everything
# regardless of console level -- the DMUB timeouts and the Thunderbolt
# collapse that preceded the 2026-09-27 lockup were all readable afterwards
# with `journalctl -k -b -1`. What this buys is seeing a failure on screen as
# it happens, which matters when a hang stops the journal being flushed.
KERNEL_CMDLINE[default]+=" loglevel=4 systemd.show_status=true"
