# Magic SysRq: recovery keys for a wedged desktop.
#
# Arch ships kernel.sysrq=16, which is sync only. That leaves no way to
# recover a frozen session except holding the power button, which cuts power
# with dirty filesystem buffers still in memory.
#
# This matters here because the dock can wedge the GPU's display
# microcontroller ("amdgpu [drm] *ERROR* wait_for_completion_timeout") while
# the rest of the system is still running. The screen is dead but the kernel
# is not, so the orderly sequence below still works:
#
#   Alt+SysRq+R  take the keyboard back from the compositor
#   Alt+SysRq+E  SIGTERM everything except init
#   Alt+SysRq+I  SIGKILL everything except init
#   Alt+SysRq+S  flush filesystem buffers to disk
#   Alt+SysRq+U  remount everything read-only
#   Alt+SysRq+B  reboot
#
# Wait a couple of seconds between S and U, and again before B.
#
# 1 enables every function. On a single-user handheld the alternative -- a
# hard power cut on a btrfs root -- is the greater risk.
kernel.sysrq = 1
