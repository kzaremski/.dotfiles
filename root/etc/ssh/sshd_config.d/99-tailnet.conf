# SSH exists here for one reason: recovering this machine when the display is
# wedged but the kernel is still alive.
#
# The dock can hang the GPU's display microcontroller ("amdgpu [drm] *ERROR*
# wait_for_completion_timeout") while everything else keeps running. Without a
# way in, the only option is holding the power button and cutting power with
# dirty buffers in memory. With this, the fix is:
#
#   ssh pocket
#   systemctl reboot        # orderly: unmounts, flushes, no fsck roulette
#
# Reachability is NOT enforced here -- sshd listens on every interface and ufw
# decides who may actually arrive, allowing port 22 in on tailscale0 only.
# Doing it that way avoids binding to the tailnet address at boot, which would
# make sshd fail to start whenever it came up before tailscaled.
#
# Keys only. This box is reachable from a tailnet that spans machines that are
# not all under my control, so a guessable password is not an acceptable
# fallback.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
