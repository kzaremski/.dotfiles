# Hardware watchdog.
#
# /dev/watchdog exists on this machine but nothing was using it, so a true
# kernel hang sat there indefinitely until someone held the power button.
# systemd pets the watchdog while it is alive; if it stops, the hardware
# resets the box on its own.
#
# 60s is deliberately generous. A shorter timeout risks rebooting during a
# legitimate stall -- heavy swap, a slow device probe -- and an unnecessary
# reboot is worse than waiting a minute.
#
# This does not save unsaved work: that is lost in any hang. What it buys is
# an automatic recovery instead of an indefinite freeze, and a reset driven
# by the watchdog rather than a power cut.
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=10min
