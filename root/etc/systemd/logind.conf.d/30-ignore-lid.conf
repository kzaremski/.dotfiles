# Never suspend on lid close.
#
# systemd's own default is HandleLidSwitch=suspend, and Omarchy's drop-ins
# (10-ignore-power-button, 20-inhibit-delay) do not touch lid policy, so that
# default was in effect before this file.
#
# All three lid keys are pinned so the behaviour cannot silently change with
# dock or AC state:
#   HandleLidSwitch              - undocked, on battery
#   HandleLidSwitchExternalPower - on AC (when unset it inherits HandleLidSwitch)
#   HandleLidSwitchDocked        - with an external display attached
#
# Note: this only governs SUSPEND. Hyprland still fires
# `switch:on:Lid Switch` -> omarchy-system-lid-close, which locks the session
# and reconciles displays. Idle-timeout sleep (omarchy shell `idle` in
# ~/.config/omarchy/shell.json) is also unaffected.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
