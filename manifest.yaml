# Dotfiles Manifest
# This file defines which configuration files should be managed by dotfiles.py
#
# Format:
#   - source: Path relative to dotfiles repo
#     dest: Path relative to home directory
#     description: Human-readable description
#
# To add a new dotfile, simply add a new entry to this list.

dotfiles:
  # Claude Code configuration (only commands, not credentials/history)
  - source: claude/commands
    dest: .claude/commands
    description: Claude Code custom slash commands

  # Git configuration
  - source: .gitignore_global
    dest: .gitignore_global
    description: Global gitignore (ignores .claude, OS files, etc.)

  # GPG configuration
  - source: .gnupg/gpg-agent.conf
    dest: .gnupg/gpg-agent.conf
    description: GPG agent config (TTY-based password prompts)

  # Shell configurations
  - source: .bashrc
    dest: .bashrc
    description: Bash configuration

  - source: .zshrc
    dest: .zshrc
    description: Zsh configuration

  - source: .profile
    dest: .profile
    description: Shell profile

  # Editor configurations
  - source: .vimrc
    dest: .vimrc
    description: Vim configuration

  - source: .config/zed
    dest: .config/zed
    description: Zed editor configuration

  # X11 configurations
  - source: .Xresources
    dest: .Xresources
    description: X resources (URxvt, colors, fonts)

  # GTK/Qt font rendering
  - source: .config/gtk-3.0/settings.ini
    dest: .config/gtk-3.0/settings.ini
    description: GTK3 settings (Terminus font)

  - source: .gtkrc-2.0
    dest: .gtkrc-2.0
    description: GTK2 settings (Terminus font)

  - source: .config/qt5ct/qt5ct.conf
    dest: .config/qt5ct/qt5ct.conf
    description: Qt5 settings (Terminus font)

  - source: .config/fontconfig
    dest: .config/fontconfig
    description: Fontconfig (disable AA for Terminus only)

  # Terminal configurations
  - source: .wezterm.lua
    dest: .wezterm.lua
    description: WezTerm terminal config

  - source: .tmux.conf
    dest: .tmux.conf
    description: tmux terminal multiplexer config

  - source: .tmux
    dest: .tmux
    description: tmux layout configurations and scripts

  # LaTeX configuration
  - source: .latexmkrc
    dest: .latexmkrc
    description: latexmk configuration for LaTeX compilation

  # Application configs (directories)
  - source: .config/i3
    dest: .config/i3
    description: i3 window manager config

  - source: .config/i3status
    dest: .config/i3status
    description: i3status bar config

  - source: .config/py3status
    dest: .config/py3status
    description: py3status bar config and custom modules

  - source: .config/picom
    dest: .config/picom
    description: Picom compositor config

  - source: .config/dunst
    dest: .config/dunst
    description: Dunst notification config

  - source: .config/alacritty
    dest: .config/alacritty
    description: Alacritty terminal config

  - source: .config/kitty
    dest: .config/kitty
    description: Kitty terminal config

  - source: .config/helix
    dest: .config/helix
    description: Helix editor config

  - source: .config/htop
    dest: .config/htop
    description: htop system monitor config

  - source: .config/bpytop
    dest: .config/bpytop
    description: bpytop system monitor config

  - source: .config/pcmanfm
    dest: .config/pcmanfm
    description: PCManFM file manager config

  - source: .config/conky
    dest: .config/conky
    description: Conky system monitor config

  - source: .config/ranger
    dest: .config/ranger
    description: Ranger terminal file manager config
