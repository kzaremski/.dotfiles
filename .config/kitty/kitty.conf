font_size          10
background_opacity 0.8
confirm_os_window_close 0

# Use xterm-256color for better SSH compatibility
# (remote servers often don't have kitty terminfo)
term xterm-256color

# Map Shift+Enter to send escape sequence that Claude Code expects
map shift+enter send_text all \x1b[13;2u

# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaCove Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
