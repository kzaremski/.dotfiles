font_family        Cascadia Code
font_size          14
disable_ligatures  never
background_opacity 0.8

# Default window size (columns x rows)
initial_window_width  123c
initial_window_height 55c
confirm_os_window_close 0

# Use xterm-256color for better SSH compatibility
# (remote servers often don't have kitty terminfo)
term xterm-256color

# Map Shift+Enter to send escape sequence that Claude Code expects
map shift+enter send_text all \x1b[13;2u

