# Electron picks its credential backend from XDG_CURRENT_DESKTOP, which is
# "Hyprland" here -- not a value Chromium's OSCrypt recognises, so it can fall
# back to "basic" (plaintext) and report that secure storage is unavailable.
# gnome-keyring-daemon runs with the "secrets" component and owns
# org.freedesktop.secrets, so point Electron straight at libsecret.
--password-store=gnome-libsecret
