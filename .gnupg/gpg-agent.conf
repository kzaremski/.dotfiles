# GPG Agent Configuration
# Use TTY for all password prompts (no GUI dialogs)

# Use pinentry-curses for TTY-based password entry
pinentry-program /usr/sbin/pinentry-curses

# Cache passwords for 1 hour (3600 seconds)
default-cache-ttl 3600
max-cache-ttl 3600

# Enable SSH support (optional - allows gpg-agent to act as ssh-agent)
# enable-ssh-support
