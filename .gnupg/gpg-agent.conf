# GPG Agent Configuration

# Cache passwords for 1 hour (3600 seconds)
default-cache-ttl 3600
max-cache-ttl 3600

# Use pinentry-auto wrapper (auto-detects curses pinentry across macOS/Linux)
pinentry-program ~/.dotfiles/scripts/pinentry-auto

# Enable SSH support (optional - allows gpg-agent to act as ssh-agent)
# enable-ssh-support
